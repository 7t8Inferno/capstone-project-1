services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL","/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
  spark:
    build: {context: .., dockerfile: streaming/Dockerfile}
    depends_on: {kafka: {condition: service_healthy}}
    volumes: ["./state:/state"]
    command: ["spark-submit","--master","local[2]","--packages","org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3","/app/streaming/spark_stream.py"]
  producer:
    build: {context: .., dockerfile: streaming/Dockerfile}
    depends_on: {kafka: {condition: service_healthy}}
    command: ["python","/app/streaming/producer.py","--interval","0.1"]
  dashboard:
    build: {context: .., dockerfile: streaming/Dockerfile}
    depends_on: [spark]
    volumes: ["./state:/state"]
    ports: ["8501:8501"]
    command: ["sh","-c","pip install streamlit==1.40.2 plotly==5.24.1 && streamlit run /app/app.py --server.address 0.0.0.0"]
