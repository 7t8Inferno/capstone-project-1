name: Capstone release smoke
on:
  push:
    branches: [main, feature/kafka-spark-streaming]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install numpy pandas
      - name: Syntax and model smoke checks
        run: python -m unittest discover -s tests -v
